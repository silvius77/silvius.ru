<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОП ответы 2026 — Тестирование</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        .app {
            background: #fff;
            max-width: 900px;
            width: 100%;
            padding: 30px 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
            border-radius: 6px;
            position: relative;
        }
        /* ===== Экран выбора темы ===== */
        #screen-topics h1 {
            font-size: 22px;
            margin-bottom: 8px;
            text-align: center;
        }
        #screen-topics p.subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 26px;
        }
        .topic-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 16px 22px;
            margin-bottom: 12px;
            font-size: 16px;
            background: #f8f9fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            cursor: pointer;
            transition: background .15s, border-color .15s;
            color: #222;
        }
        .topic-btn:hover {
            background: #eef2f6;
            border-color: #1a7f37;
        }
        .topic-btn .count {
            float: right;
            color: #1a7f37;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            padding: 12px 26px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #1a7f37;
            color: #fff;
            font-weight: bold;
            transition: background .15s;
        }
        .btn:hover { background: #146c2e; }
        .btn.secondary { background: #6c757d; }
        .btn.secondary:hover { background: #5a6268; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        /* ===== Экран вопроса ===== */
        #screen-question { display: none; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .progress-text { font-weight: bold; color: #222; }
        .score-live { font-weight: bold; }
        .score-live .ok { color: #1a7f37; }
        .score-live .bad { color: #c62828; }
        .progressbar {
            height: 6px;
            background: #e2e6ea;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 22px;
        }
        .progressbar > div {
            height: 100%;
            background: #1a7f37;
            width: 0%;
            transition: width .25s;
        }
        .question-text {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 18px;
        }
        .options { list-style: none; }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 13px 16px;
            margin-bottom: 10px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            cursor: pointer;
            transition: background .12s, border-color .12s;
            font-size: 15px;
            line-height: 1.45;
        }
        .option:hover { background: #f4f8fb; border-color: #8ab4d8; }
        .option .letter {
            flex: 0 0 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            background: #fff;
            margin-top: 1px;
        }
        .option.selected { border-color: #1a7f37; background: #f0f9f2; }
        .option.selected .letter { background: #1a7f37; color: #fff; border-color: #1a7f37; }
        .option.correct { border-color: #1a7f37; background: #e8f5ec; }
        .option.correct .letter { background: #1a7f37; color: #fff; border-color: #1a7f37; }
        .option.wrong { border-color: #c62828; background: #fbeaea; }
        .option.wrong .letter { background: #c62828; color: #fff; border-color: #c62828; }
        .option.disabled { cursor: default; }
        .option.disabled:hover { background: inherit; border-color: inherit; }
        .option.correct.disabled:hover { background: #e8f5ec; border-color: #1a7f37; }
        .option.wrong.disabled:hover { background: #fbeaea; border-color: #c62828; }
        .option.selected.disabled:hover { background: #f0f9f2; border-color: #1a7f37; }
        .option .mark { margin-left: auto; font-weight: bold; font-size: 16px; }
        .feedback {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.45;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #e8f5ec; border: 1px solid #1a7f37; color: #14532d; }
        .feedback.incorrect { background: #fbeaea; border: 1px solid #c62828; color: #7f1d1d; }
        .footer-actions {
            margin-top: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .link-back {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
        }
        .link-back:hover { color: #222; }
        /* ===== Экран результатов ===== */
        #screen-results { display: none; text-align: center; }
        #screen-results h2 { font-size: 24px; margin-bottom: 20px; }
        .result-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 8px solid #1a7f37;
            color: #1a7f37;
        }
        .result-circle .pct { font-size: 42px; font-weight: bold; line-height: 1; }
        .result-circle .lbl { font-size: 12px; color: #666; margin-top: 4px; }
        .result-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0 8px;
            flex-wrap: wrap;
        }
        .stat { font-size: 15px; }
        .stat b { display: block; font-size: 26px; }
        .stat.ok b { color: #1a7f37; }
        .stat.bad b { color: #c62828; }
        .stat.neutral b { color: #555; }
        .grade-line { font-size: 16px; margin: 16px 0 28px; font-weight: bold; }
        .result-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        /* список ошибок */
        .review {
            display: none;
            text-align: left;
            margin-top: 26px;
            border-top: 1px solid #e2e6ea;
            padding-top: 20px;
        }
        .review.show { display: block; }
        .review h3 { font-size: 17px; margin-bottom: 14px; }
        .review-item {
            border: 1px solid #e2e6ea;
            border-radius: 6px;
            padding: 14px 16px;
            margin-bottom: 14px;
        }
        .review-item .rq { font-weight: bold; margin-bottom: 8px; font-size: 15px; }
        .review-item .ra { font-size: 14px; margin-bottom: 4px; line-height: 1.4; }
        .review-item .ra.correct { color: #1a7f37; }
        .review-item .ra.wrong { color: #c62828; }
        .review-empty { color: #666; font-style: italic; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .app { padding: 20px 18px; }
            .question-text { font-size: 16px; }
            .option { font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- ===================== ЭКРАН ВЫБОРА ТЕМЫ ===================== -->
    <div id="screen-topics">
        <h1>Тестирование 2026</h1>
        <p class="subtitle">Выберите тему для тестирования</p>
        <div id="topic-list"></div>
    </div>

    <!-- ===================== ЭКРАН ВОПРОСА ===================== -->
    <div id="screen-question">
        <div class="top-bar">
            <span id="topic-name" style="font-weight:bold; color:#222;"></span>
            <span class="progress-text" id="progress-text">1 / 10</span>
            <span class="score-live">Верно: <span class="ok" id="live-ok">0</span> · Неверно: <span class="bad" id="live-bad">0</span></span>
        </div>
        <div class="progressbar"><div id="progress-fill"></div></div>

        <div class="question-text" id="question-text"></div>
        <ul class="options" id="options"></ul>

        <div class="feedback" id="feedback"></div>

        <div class="footer-actions">
            <button class="link-back" id="btn-back-topics">← К выбору темы</button>
            <div>
                <button class="btn" id="btn-next" disabled>Ответить</button>
            </div>
        </div>
    </div>

    <!-- ===================== ЭКРАН РЕЗУЛЬТАТОВ ===================== -->
    <div id="screen-results">
        <h2>Результат теста</h2>
        <div class="result-circle" id="result-circle">
            <span class="pct" id="result-pct">0%</span>
            <span class="lbl">правильных</span>
        </div>
        <div class="result-stats">
            <div class="stat ok">Правильно<b id="stat-ok">0</b></div>
            <div class="stat bad">Неправильно<b id="stat-bad">0</b></div>
            <div class="stat neutral">Пропущено<b id="stat-skip">0</b></div>
        </div>
        <div class="grade-line" id="grade-line"></div>
        <div class="result-actions">
            <button class="btn" id="btn-retry">Пройти заново</button>
            <button class="btn secondary" id="btn-another">Другая тема</button>
            <button class="btn secondary" id="btn-review">Показать ошибки</button>
        </div>
        <div class="review" id="review"></div>
    </div>

</div>

        "изменение форм и способов взаимодействия с окружающими людьми, стремлении перенести проблемы профессионального профиля на сферу вне профессиональной деятельности;",
        "все перечисленное."
      ], correct: 3 }
  ]
};

/* =====================================================================
   ЛОГИКА ТЕСТА
   ===================================================================== */
(function () {
    const screenTopics   = document.getElementById('screen-topics');
    const screenQuestion = document.getElementById('screen-question');
    const screenResults  = document.getElementById('screen-results');

    const topicListEl = document.getElementById('topic-list');
    const topicNameEl = document.getElementById('topic-name');
    const progressTextEl = document.getElementById('progress-text');
    const progressFillEl = document.getElementById('progress-fill');
    const questionTextEl = document.getElementById('question-text');
    const optionsEl = document.getElementById('options');
    const feedbackEl = document.getElementById('feedback');
    const btnNext = document.getElementById('btn-next');
    const btnBackTopics = document.getElementById('btn-back-topics');
    const liveOkEl = document.getElementById('live-ok');
    const liveBadEl = document.getElementById('live-bad');

    const resultPctEl = document.getElementById('result-pct');
    const resultCircleEl = document.getElementById('result-circle');
    const statOkEl = document.getElementById('stat-ok');
    const statBadEl = document.getElementById('stat-bad');
    const statSkipEl = document.getElementById('stat-skip');
    const gradeLineEl = document.getElementById('grade-line');
    const reviewEl = document.getElementById('review');
    const btnRetry = document.getElementById('btn-retry');
    const btnAnother = document.getElementById('btn-another');
    const btnReview = document.getElementById('btn-review');

    let state = {
        topic: '',
        questions: [],
        index: 0,
        answers: [],      // null | number (индекс выбранного)
        finished: false
    };

    const LETTERS = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Ж', 'З'];

    /* ---------- Стартовый экран ---------- */
    function buildTopicList() {
        topicListEl.innerHTML = '';
        Object.keys(DATA).forEach(topic => {
            const count = DATA[topic].length;
            const btn = document.createElement('button');
            btn.className = 'topic-btn';
            btn.innerHTML = `<span>${topic}</span><span class="count">${count} вопр.</span>`;
            btn.addEventListener('click', () => startTest(topic));
            topicListEl.appendChild(btn);
        });
    }

    function showScreen(el) {
        [screenTopics, screenQuestion, screenResults].forEach(s => s.style.display = 'none');
        el.style.display = 'block';
    }

    /* ---------- Запуск теста ---------- */
    function startTest(topic) {
        state = {
            topic,
            questions: DATA[topic].slice(),
            index: 0,
            answers: new Array(DATA[topic].length).fill(null),
            finished: false
        };
        showScreen(screenQuestion);
        renderQuestion();
    }

    /* ---------- Отрисовка текущего вопроса ---------- */
    function renderQuestion() {
        const q = state.questions[state.index];
        const total = state.questions.length;

        topicNameEl.textContent = state.topic;
        progressTextEl.textContent = `${state.index + 1} / ${total}`;
        progressFillEl.style.width = `${((state.index) / total) * 100}%`;
        liveOkEl.textContent = state.answers.filter((a, i) => a !== null && a === state.questions[i].correct).length;
        liveBadEl.textContent = state.answers.filter((a, i) => a !== null && a !== state.questions[i].correct).length;

        questionTextEl.textContent = `${state.index + 1}. ${q.text}`;

        optionsEl.innerHTML = '';
        feedbackEl.className = 'feedback';
        feedbackEl.textContent = '';
        btnNext.disabled = true;
        btnNext.textContent = 'Ответить';

        q.options.forEach((optText, i) => {
            const li = document.createElement('li');
            li.className = 'option';
            li.dataset.idx = i;
            const letter = document.createElement('span');
            letter.className = 'letter';
            letter.textContent = LETTERS[i] || i + 1;
            const txt = document.createElement('span');
            txt.className = 'option-text';
            txt.textContent = optText;
            const mark = document.createElement('span');
            mark.className = 'mark';
            li.appendChild(letter);
            li.appendChild(txt);
            li.appendChild(mark);
            li.addEventListener('click', () => onSelectOption(i));
            optionsEl.appendChild(li);
        });
    }

    /* ---------- Выбор варианта ---------- */
    function onSelectOption(selectedIdx) {
        // Если уже ответили на этот вопрос — не даём менять
        if (state.answers[state.index] !== null) return;

        const q = state.questions[state.index];
        const isCorrect = selectedIdx === q.correct;
        state.answers[state.index] = selectedIdx;

        // Помечаем варианты
        const items = optionsEl.querySelectorAll('.option');
        items.forEach((li) => {
            const idx = Number(li.dataset.idx);
            li.classList.add('disabled');
            li.style.cursor = 'default';
            if (idx === q.correct) {
                li.classList.add('correct');
                li.querySelector('.mark').textContent = '✓';
            } else if (idx === selectedIdx && !isCorrect) {
                li.classList.add('wrong');
                li.querySelector('.mark').textContent = '✗';
            }
            if (idx === selectedIdx) li.classList.add('selected');
        });

        // Фидбек
        feedbackEl.classList.add('show', isCorrect ? 'correct' : 'incorrect');
        feedbackEl.textContent = isCorrect
            ? '✅ Правильно!'
            : `❌ Неправильно. Правильный ответ: ${LETTERS[q.correct] || q.correct + 1}.`;

        // Кнопка далее
        btnNext.disabled = false;
        btnNext.textContent = (state.index === state.questions.length - 1) ? 'Завершить' : 'Далее →';
        liveOkEl.textContent = state.answers.filter((a, i) => a !== null && a === state.questions[i].correct).length;
        liveBadEl.textContent = state.answers.filter((a, i) => a !== null && a !== state.questions[i].correct).length;
    }

    /* ---------- Переход к следующему вопросу / завершение ---------- */
    btnNext.addEventListener('click', () => {
        if (state.answers[state.index] === null) return;
        if (state.index < state.questions.length - 1) {
            state.index++;
            renderQuestion();
        } else {
            finishTest();
        }
    });

    /* ---------- Завершение теста ---------- */
    function finishTest() {
        state.finished = true;
        const total = state.questions.length;
        const ok = state.answers.filter((a, i) => a !== null && a === state.questions[i].correct).length;
        const bad = state.answers.filter((a, i) => a !== null && a !== state.questions[i].correct).length;
        const skip = state.answers.filter(a => a === null).length;
        const pct = Math.round((ok / total) * 100);

        // Круг
        resultPctEl.textContent = pct + '%';
        let color = '#1a7f37';
        if (pct < 50) color = '#c62828';
        else if (pct < 70) color = '#e67700';
        resultCircleEl.style.borderColor = color;
        resultCircleEl.querySelector('.pct').style.color = color;

        statOkEl.textContent = ok;
        statBadEl.textContent = bad;
        statSkipEl.textContent = skip;

        let grade = 'Неудовлетворительно';
        if (pct >= 90) grade = 'Отлично';
        else if (pct >= 70) grade = 'Хорошо';
        else if (pct >= 50) grade = 'Удовлетворительно';
        gradeLineEl.textContent = `Оценка: ${grade}`;
        gradeLineEl.style.color = pct >= 50 ? '#1a7f37' : '#c62828';

        // Сброс панели ошибок
        reviewEl.classList.remove('show');
        reviewEl.innerHTML = '';
        btnReview.textContent = 'Показать ошибки';

        showScreen(screenResults);
    }

    /* ---------- Кнопки на экране результатов ---------- */
    btnRetry.addEventListener('click', () => {
        startTest(state.topic);
    });

    btnAnother.addEventListener('click', () => {
        showScreen(screenTopics);
        buildTopicList();
    });

    btnReview.addEventListener('click', () => {
        if (reviewEl.classList.contains('show')) {
            reviewEl.classList.remove('show');
            btnReview.textContent = 'Показать ошибки';
            return;
        }
        // Собираем неправильные
        const wrongItems = [];
        state.questions.forEach((q, i) => {
            if (state.answers[i] === null || state.answers[i] !== q.correct) {
                wrongItems.push({ q, selected: state.answers[i] });
            }
        });
        if (wrongItems.length === 0) {
            reviewEl.innerHTML = '<p class="review-empty">Все ответы верные — ошибок нет. 🎉</p>';
        } else {
            reviewEl.innerHTML = '<h3>Разбор ошибок</h3>' + wrongItems.map(item => {
                const q = item.q;
                const sel = item.selected;
                const correctLetter = LETTERS[q.correct] || q.correct + 1;
                const correctText = q.options[q.correct];
                let html = `<div class="review-item">
                    <div class="rq">${q.text}</div>
                    <div class="ra correct">✅ Правильный ответ: ${correctLetter}) ${correctText}</div>`;
                if (sel === null) {
                    html += `<div class="ra wrong">❌ Ответ не дан</div>`;
                } else {
                    const selLetter = LETTERS[sel] || sel + 1;
                    html += `<div class="ra wrong">❌ Ваш ответ: ${selLetter}) ${q.options[sel]}</div>`;
                }
                html += `</div>`;
                return html;
            }).join('');
        }
        reviewEl.classList.add('show');
        btnReview.textContent = 'Скрыть ошибки';
    });

    /* ---------- Кнопка «К выбору темы» ---------- */
    btnBackTopics.addEventListener('click', () => {
        if (state.answers.some(a => a !== null) && !state.finished) {
            if (!confirm('Прервать тест? Прогресс не сохранится.')) return;
        }
        showScreen(screenTopics);
        buildTopicList();
    });

    /* ---------- Инициализация ---------- */
    buildTopicList();
    showScreen(screenTopics);

})();
</script>
</body>
</html>
